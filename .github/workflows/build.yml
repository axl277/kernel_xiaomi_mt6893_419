
name: Build Kernel agate 4.19

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler \
            python3 \
            zip \
            git

      - name: Setup Build Environment
        run: |
          chmod +x build.sh

          echo "DEVICE=agate" >> $GITHUB_ENV
          echo "DEFCONFIG=agate_defconfig" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "IMAGE_NAME=Image.gz-dtb" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          ./build.sh

      - name: Clone AnyKernel3
        run: |
          git clone \
            https://github.com/axl277/AnyKernel3.git \
            AnyKernel3

      - name: Prepare AnyKernel3
        run: |
          cp dist/Image.gz-dtb AnyKernel3/

          cd AnyKernel3

          zip -r9 ../Kernel-agate-4.19.zip . \
            -x ".git/*" \
            "README.md" \
            "*placeholder*"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-agate-4.19
          path: dist/Image.gz-dtb

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-agate-4.19
          path: Kernel-agate-4.19.zip
