name: Build Kernel Agate

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libssl-dev libxml-utils libxml2-utils lzop npm pngcrush python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - uses: hendrikmueller/ccache-action@v1.2
        with:
          key: kernel-4.19-${{ github.ref_name }}

      - name: Build
        run: |
          sed -i 's/-Werror//g' Makefile || true
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=aarch64-linux-gnu-gcc
          export USE_CCACHE=1
          mkdir -p out
          make O=out agate_defconfig
          make O=out -j$(nproc)

      - name: AnyKernel3
        run: |
          git clone --depth=1 https://github.com/axl277/AnyKernel3
          cd AnyKernel3
          rm -rf .git .github README.md
          sed -i 's/device.name1=/device.name1=agate/g' anykernel.sh
          sed -i 's|block=.*;|block=auto;|g' anykernel.sh
          sed -i 's|is_slot_device=.*;|is_slot_device=auto;|g' anykernel.sh
          if [ -f "../out/arch/arm64/boot/Image.gz-dtb" ]; then cp "../out/arch/arm64/boot/Image.gz-dtb" .
          elif [ -f "../out/arch/arm64/boot/Image.gz" ]; then cp "../out/arch/arm64/boot/Image.gz" .
          elif [ -f "../out/arch/arm64/boot/Image" ]; then cp "../out/arch/arm64/boot/Image" .
          else exit 1; fi
          zip -r9 "../agate-kernel.zip" * -x README.md
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: agate-kernel-${{ github.ref_name }}
          path: agate-kernel.zip