
name: MT6893 Kernel 4.19 Build

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Clean previous build
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel - agate
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ====================================
      # Checkout source
      # ====================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 1

      # ====================================
      # Install dependencies
      # ====================================

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            git \
            curl \
            zip \
            unzip \
            python3 \
            ccache \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler

      # ====================================
      # Setup toolchain
      # ====================================

      - name: Setup Proton Clang 15
        run: |
          mkdir -p "$HOME/toolchains"

          git clone --depth=1 \
            -b clang-15 \
            https://gitlab.com/LeCmnGend/proton-clang.git \
            "$HOME/toolchains/proton-clang"

          echo "$HOME/toolchains/proton-clang/bin" >> "$GITHUB_PATH"

          clang --version || true

      # ====================================
      # Check source
      # ====================================

      - name: Check Kernel Configuration
        run: |
          echo "Checking agate_defconfig..."

          test -f arch/arm64/configs/agate_defconfig

          echo "Defconfig found."

          grep -n "ksm_flock" \
            include/linux/keyslot-manager.h \
            block/blk-crypto.c || true

      # ====================================
      # Build kernel
      # ====================================

      - name: Compile Kernel
        run: |
          chmod +x build.sh

          if [[ "${{ inputs.clean_build }}" == "true" ]]; then
            ./build.sh agate -c
          else
            ./build.sh agate
          fi

      # ====================================
      # Checkout AnyKernel3
      # ====================================

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/axl277/AnyKernel3.git \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh

      # ====================================
      # Package kernel
      # ====================================

      - name: Package AnyKernel3
        run: |
          cp dist/Image.gz AnyKernel3/Image.gz

          cd AnyKernel3

          zip -r9 \
            ../Kernel-agate-4.19.zip \
            . \
            -x ".git/*" \
               "README.md" \
               "*placeholder*"

          cd ..

          sha256sum Kernel-agate-4.19.zip \
            > Kernel-agate-4.19.zip.sha256

      # ====================================
      # Upload kernel image
      # ====================================

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-agate-4.19
          path: |
            dist/Image.gz
            dist/Image.gz.sha256
          if-no-files-found: error
          retention-days: 14

      # ====================================
      # Upload AnyKernel3
      # ====================================

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-agate-4.19
          path: |
            Kernel-agate-4.19.zip
            Kernel-agate-4.19.zip.sha256
          if-no-files-found: error
          retention-days: 14
