name: Build Kernel Agate

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libssl-dev libxml2-utils lzop npm pngcrush python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev gcc-aarch64-linux-gnu

      - name: Setup Ccache
        uses: Chocobo1/setup-ccache-action@v1

      - name: Build
        run: |
          find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          export USE_CCACHE=1
          export KCFLAGS="-Wno-error"
          export KBUILD_HOSTCFLAGS="-Wno-error"
          mkdir -p out
          make O=out agate_defconfig
          make O=out -j$(nproc)

      - name: AnyKernel3
        run: |
          git clone --depth=1 https://github.com/axl277/AnyKernel3
          cd AnyKernel3
          rm -rf .git .github README.md
          sed -i 's/device.name1=/device.name1=agate/g' anykernel.sh
          sed -i 's|block=.*;|block=auto;|g' anykernel.sh
          sed -i 's|is_slot_device=.*;|is_slot_device=auto;|g' anykernel.sh
          if [ -f "../out/arch/arm64/boot/Image.gz-dtb" ]; then cp "../out/arch/arm64/boot/Image.gz-dtb" .
          elif [ -f "../out/arch/arm64/boot/Image.gz" ]; then cp "../out/arch/arm64/boot/Image.gz" .
          elif [ -f "../out/arch/arm64/boot/Image" ]; then cp "../out/arch/arm64/boot/Image" .
          else exit 1; fi
          zip -r9 "../agate-kernel.zip" * -x README.md
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: agate-kernel-${{ github.ref_name }}
          path: agate-kernel.zip