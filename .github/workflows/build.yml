
name: MT6893 Kernel 4.19 - LLVM 18

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Clean build
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build agate - Kernel 4.19
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # Checkout kernel
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 1

      # Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            git \
            zip \
            unzip \
            python3 \
            ccache \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            clang-18 \
            lld-18 \
            llvm-18 \
            llvm-18-tools \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # Verify LLVM
      - name: Verify LLVM 18
        run: |
          clang-18 --version
          ld.lld-18 --version
          llvm-ar-18 --version

      # Check source
      - name: Check Defconfig
        run: |
          test -f arch/arm64/configs/agate_defconfig

          echo "agate_defconfig found"

      # Setup ccache
      - name: Setup Ccache
        run: |
          mkdir -p "$HOME/.ccache"
          ccache -M 100G
          ccache -s

      # Build kernel
      - name: Compile Kernel
        id: compile
        continue-on-error: true
        run: |
          chmod +x build.sh

          if [[ "${{ inputs.clean_build }}" == "true" ]]; then
            ./build.sh agate -c
          else
            ./build.sh agate
          fi

      # Upload build log even on failure
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agate-build-log
          path: |
            error.log
          if-no-files-found: ignore
          retention-days: 14

      # Stop if compilation failed
      - name: Check Build Status
        if: steps.compile.outcome == 'failure'
        run: exit 1

      # Clone your AnyKernel3
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/axl277/AnyKernel3.git \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh

      # Package
      - name: Package Kernel
        run: |
          cp dist/Image.gz AnyKernel3/Image.gz

          cd AnyKernel3

          zip -r9 \
            ../Kernel-agate-4.19-LLVM18.zip \
            . \
            -x ".git/*" \
               ".github/*" \
               "README.md" \
               "*placeholder*"

          cd ..

          sha256sum Kernel-agate-4.19-LLVM18.zip \
            > Kernel-agate-4.19-LLVM18.zip.sha256

      # Upload image
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: agate-kernel-image
          path: |
            dist/Image.gz
            dist/Image.gz.sha256
          retention-days: 14

      # Upload ZIP
      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: agate-AnyKernel3-LLVM18
          path: |
            Kernel-agate-4.19-LLVM18.zip
            Kernel-agate-4.19-LLVM18.zip.sha256
          retention-days: 14
